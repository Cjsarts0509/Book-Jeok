# 북적북적 셀프호스트 구성 (오라클 클라우드 VM에서 그대로 사용 가능)
# DB 데이터와 파일 저장소는 독립 블록 볼륨( /mnt/bookjeok-data )에 바인드 마운트합니다.
services:
  db:
    image: postgres:16-alpine
    container_name: bookjeok-db
    restart: unless-stopped
    # 로그가 OS 부팅 디스크를 채워 VM 전체가 다운되는 것을 방지(회전)
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    # OOM 시 호스트가 임의 프로세스를 죽이지 않도록 컨테이너 메모리 상한(12GB 중)
    mem_limit: 3g
    environment:
      POSTGRES_USER: ${DB_USER:-bookjeok}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 .env 에 설정하세요}
      POSTGRES_DB: ${DB_NAME:-bookjeok}
    volumes:
      # 오라클 독립 디스크의 DB 전용 디렉터리
      - ${DATA_ROOT:-/mnt/bookjeok-data}/pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # 외부 노출 금지, 로컬만
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bookjeok}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s   # 최초 볼륨 initdb 시간이 길어도 db를 unhealthy로 오판하지 않도록

  api:
    build: ./backend
    container_name: bookjeok-api
    restart: unless-stopped
    # 로그 회전(부팅 디스크 보호) + 메모리 상한(LibreOffice/zip이 튀어도 호스트/DB를 지킴)
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    mem_limit: 4g
    # 프로세스는 살아있는데 이벤트 루프가 멎은 경우까지 감지(단순 재시작 정책으로는 못 잡음)
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:4000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      SERVE_FRONTEND: ${SERVE_FRONTEND:-1}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-bookjeok}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-bookjeok}
      STORAGE_ROOT: /data/storage
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 를 설정하세요}
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY 를 설정하세요}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4000}
      SUPER_ADMINS: ${SUPER_ADMINS:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # 주간 리포트 이메일(선택) — 설정 시 매주 월요일 자동 발송. 미설정 시 미리보기만.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      REPORT_TO: ${REPORT_TO:-}
      REPORT_CRON: ${REPORT_CRON:-0 8 * * 1}
      REPORT_TZ: ${REPORT_TZ:-Asia/Seoul}
      # YARA 악성 패턴 검사(선택): 끄려면 0, 룰 경로 변경 시 YARA_RULES
      YARA_ENABLED: ${YARA_ENABLED:-}
    volumes:
      # 파일 저장소도 독립 디스크에
      - ${DATA_ROOT:-/mnt/bookjeok-data}/storage:/data/storage
      - ./frontend:/app/frontend:ro
      # 서버 상태(상위 프로세스 CPU·메모리) 표시용 — 호스트 프로세스 정보 읽기전용(이름만 사용)
      - /proc:/host/proc:ro
    ports:
      - "127.0.0.1:4000:4000"   # Cloudflare Tunnel / nginx 뒤에 둠
