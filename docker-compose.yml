# 북적북적 셀프호스트 구성 (오라클 클라우드 VM에서 그대로 사용 가능)
# DB 데이터와 파일 저장소는 독립 블록 볼륨( /mnt/bookjeok-data )에 바인드 마운트합니다.
services:
  db:
    image: postgres:16-alpine
    container_name: bookjeok-db
    restart: unless-stopped
    # 로그가 OS 부팅 디스크를 채워 VM 전체가 다운되는 것을 방지(회전)
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    # OOM 시 호스트가 임의 프로세스를 죽이지 않도록 컨테이너 메모리 상한(12GB 중)
    mem_limit: 3g
    # 추가 권한 획득 차단(postgres 는 내부적으로 setuid 를 쓰므로 capability 는 건드리지 않는다)
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: ${DB_USER:-bookjeok}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 .env 에 설정하세요}
      POSTGRES_DB: ${DB_NAME:-bookjeok}
    volumes:
      # 오라클 독립 디스크의 DB 전용 디렉터리
      - ${DATA_ROOT:-/mnt/bookjeok-data}/pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # 외부 노출 금지, 로컬만
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bookjeok}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s   # 최초 볼륨 initdb 시간이 길어도 db를 unhealthy로 오판하지 않도록

  api:
    build: ./backend
    container_name: bookjeok-api
    restart: unless-stopped
    # 로그 회전(부팅 디스크 보호) + 메모리 상한(LibreOffice/zip이 튀어도 호스트/DB를 지킴)
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    mem_limit: 4g
    # 권한 축소: 이미지가 비-root(node, uid 1000)로 실행되며 추가 권한 획득·리눅스 capability 를 모두 막는다.
    # LibreOffice/YARA 가 신뢰할 수 없는 파일을 파싱하는 구조라 문서 파싱 취약점의 피해 범위를 줄인다.
    # pids_limit: 악성 문서가 fork 폭탄을 일으켜도 호스트를 못 잡아먹게.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 512
    # 프로세스는 살아있는데 이벤트 루프가 멎은 경우까지 감지(단순 재시작 정책으로는 못 잡음)
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:4000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      SERVE_FRONTEND: ${SERVE_FRONTEND:-1}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-bookjeok}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-bookjeok}
      STORAGE_ROOT: /data/storage
      # 업로드 1건 최대 크기(bytes, 기본 2GB) · 계정 기본 할당량(bytes, 0=무제한)
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-}
      DEFAULT_QUOTA: ${DEFAULT_QUOTA:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 를 설정하세요}
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY 를 설정하세요}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4000}
      # CSP: 프런트가 호출하는 API 주소(frontend/config.js 의 BOOKJEOK_API)를 넣는다. 같은 서버면 비워둠.
      # CSP_ENFORCE=1 이면 실제 차단, 미설정이면 '보고만'(기능 확인 후 켜기).
      CSP_API_ORIGIN: ${CSP_API_ORIGIN:-}
      CSP_ENFORCE: ${CSP_ENFORCE:-}
      SUPER_ADMINS: ${SUPER_ADMINS:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # 주간 리포트 이메일(선택) — 설정 시 매주 월요일 자동 발송. 미설정 시 미리보기만.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      REPORT_TO: ${REPORT_TO:-}
      REPORT_CRON: ${REPORT_CRON:-0 8 * * 1}
      REPORT_TZ: ${REPORT_TZ:-Asia/Seoul}
      # ISBN 도서정보 자동 채우기(선택). 미설정 시 키가 필요 없는 openlibrary 로 시도한다.
      #   naver 는 BOOK_API_KEY 를 "클라이언트ID:시크릿" 형식으로 넣어야 한다.
      BOOK_API_PROVIDER: ${BOOK_API_PROVIDER:-}
      BOOK_API_KEY: ${BOOK_API_KEY:-}
      # IP당 15분 요청 한도(기본 300). 부하 시험 때 임시로 올린다.
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-}
      # 목록 캐시 끄기(문제 발생 시 0). 미설정이면 켜짐.
      LIST_CACHE: ${LIST_CACHE:-}
      # YARA 악성 패턴 검사(선택): 끄려면 0, 룰 경로 변경 시 YARA_RULES
      YARA_ENABLED: ${YARA_ENABLED:-}
    volumes:
      # 파일 저장소도 독립 디스크에
      - ${DATA_ROOT:-/mnt/bookjeok-data}/storage:/data/storage
      - ./frontend:/app/frontend:ro
      # 서버 상태(상위 프로세스 CPU·메모리) 표시용 — 호스트 프로세스 정보 읽기전용(이름만 사용)
      - /proc:/host/proc:ro
    ports:
      - "127.0.0.1:4000:4000"   # Cloudflare Tunnel / nginx 뒤에 둠
