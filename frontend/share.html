<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FFD166">
  <title>공유 파일 · 북적북적</title>
  <link rel="icon" href="assets/logo.svg?v=155" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=155">
</head>
<body>
  <div class="login-screen">
    <div class="login-card" style="max-width:420px">
      <img src="assets/logo.svg?v=155" class="login-logo" alt="북적북적">
      <div class="login-title">공유 파일</div>
      <div id="share-view" style="width:100%;margin-top:8px">
        <p class="muted" style="text-align:center">불러오는 중…</p>
      </div>
    </div>
  </div>
  <script src="config.js?v=155"></script>
  <script>
  (function () {
    const BASE = (window.BOOKJEOK_API || '').replace(/\/$/, '');
    const view = document.getElementById('share-view');
    const token = new URLSearchParams(location.search).get('t');
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmtBytes = (n) => { n = Number(n) || 0; if (!n) return '0 B'; const u = ['B', 'KB', 'MB', 'GB', 'TB']; const i = Math.floor(Math.log(n) / Math.log(1024)); return (n / Math.pow(1024, i)).toFixed(i ? 1 : 0) + ' ' + u[i]; };
    if (!token) { view.innerHTML = '<p class="muted" style="text-align:center">잘못된 링크입니다.</p>'; return; }

    async function load() {
      try {
        const r = await fetch(`${BASE}/api/share/${encodeURIComponent(token)}`);
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || '유효하지 않은 링크입니다.');
        render(d);
      } catch (e) { view.innerHTML = `<p class="muted" style="text-align:center;color:var(--danger)">${esc(e.message)}</p>`; }
    }

    function render(d) {
      if (d.exhausted) { view.innerHTML = `<p style="text-align:center;color:var(--danger)">다운로드 횟수 제한을 초과한 링크입니다.</p>`; return; }
      const meta = `<div class="secret-box" style="user-select:text">${esc(d.fileName)}</div>
        <p class="muted" style="text-align:center;margin-top:8px">크기: ${fmtBytes(d.size)}${d.limited ? ` · 남은 다운로드 ${d.remaining}회` : ''}</p>`;
      const pwField = d.needsPassword
        ? `<div class="field" style="margin-top:14px"><label>비밀번호</label><input class="input" type="password" id="pw" placeholder="공유 비밀번호"></div>` : '';
      view.innerHTML = `${meta}${pwField}
        <button class="btn btn-primary" id="dl" style="width:100%;margin-top:14px">⬇️ 다운로드</button>
        <p id="msg" class="muted" style="text-align:center;margin-top:10px;font-size:13px"></p>`;
      document.getElementById('dl').addEventListener('click', download);
      const pw = document.getElementById('pw');
      if (pw) pw.addEventListener('keydown', (e) => { if (e.key === 'Enter') download(); });
    }

    async function download() {
      const btn = document.getElementById('dl'), msg = document.getElementById('msg');
      const pw = document.getElementById('pw') ? document.getElementById('pw').value : '';
      btn.disabled = true; msg.textContent = '준비 중…'; msg.style.color = '';
      try {
        const r = await fetch(`${BASE}/api/share/${encodeURIComponent(token)}/download`, { headers: pw ? { 'x-share-password': pw } : {} });
        if (!r.ok) { let err = '다운로드 실패'; try { err = (await r.json()).error || err; } catch (_) {} throw new Error(err); }
        const cd = r.headers.get('content-disposition') || '';
        let name = d_name(cd) || 'download';
        const blob = await r.blob();
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); URL.revokeObjectURL(a.href);
        msg.style.color = 'var(--accent)'; msg.textContent = '다운로드가 시작되었습니다 ✅';
        load(); // 남은 횟수 갱신
      } catch (e) { msg.style.color = 'var(--danger)'; msg.textContent = e.message; }
      finally { btn.disabled = false; }
    }
    function d_name(cd) {
      let m = /filename\*=(?:UTF-8'')?([^;]+)/i.exec(cd);
      if (m) { try { return decodeURIComponent(m[1].trim().replace(/^["']|["']$/g, '')); } catch (_) { return m[1].trim(); } }
      m = /filename="?([^";]+)"?/i.exec(cd); return m ? m[1].trim() : null;
    }
    load();
  })();
  </script>
</body>
</html>
